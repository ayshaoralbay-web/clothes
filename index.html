<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maison</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root { --black: #0d0d0d; --white: #fafaf8; --cream: #f4f1eb; --gray: #8a8a8a; --light: #e8e4dc; --accent: #c8a96e; }
      body { font-family: "DM Sans", sans-serif; background: var(--cream); color: var(--black); }
      header { position: sticky; top: 0; z-index: 50; background: var(--black); display: flex; align-items: center; justify-content: space-between; padding: 0 48px; height: 68px; }
      .header-left { display: flex; gap: 28px; }
      .nav-link { color: var(--gray); font-size: 13px; letter-spacing: 1px; cursor: pointer; transition: color 0.2s; }
      .nav-link:hover { color: var(--white); }
      .logo { font-family: "Playfair Display", serif; font-size: 22px; letter-spacing: 6px; color: var(--white); text-transform: uppercase; }
      .logo em { color: var(--accent); font-style: italic; }
      .cart-btn { display: flex; align-items: center; gap: 10px; background: none; border: 1px solid rgba(255,255,255,0.2); color: var(--white); padding: 9px 20px; border-radius: 2px; cursor: pointer; font-family: "DM Sans", sans-serif; font-size: 13px; letter-spacing: 1px; transition: all 0.2s; }
      .cart-btn:hover { background: var(--accent); border-color: var(--accent); color: var(--black); }
      #badge { background: var(--accent); color: var(--black); width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; }
      .hero { background: var(--white); padding: 56px 48px 40px; border-bottom: 1px solid var(--light); }
      .hero-inner { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; flex-wrap: wrap; }
      .hero-text h1 { font-family: "Playfair Display", serif; font-size: 52px; font-weight: 400; line-height: 1.1; margin-bottom: 8px; }
      .hero-text h1 em { color: var(--accent); font-style: italic; }
      .hero-text p { font-size: 13px; color: var(--gray); letter-spacing: 2px; text-transform: uppercase; }
      .hero-search { display: flex; flex-direction: column; gap: 10px; }
      .search-label { font-size: 11px; letter-spacing: 2px; color: var(--gray); text-transform: uppercase; }
      .search-row { display: flex; }
      .search-row input { width: 300px; padding: 13px 18px; border: 1px solid var(--light); border-right: none; border-radius: 2px 0 0 2px; font-family: "DM Sans", sans-serif; font-size: 14px; background: var(--cream); color: var(--black); outline: none; transition: border-color 0.2s; }
      .search-row input:focus { border-color: var(--accent); }
      .search-row input::placeholder { color: var(--gray); }
      .search-row button { padding: 13px 24px; background: var(--black); color: var(--white); border: none; border-radius: 0 2px 2px 0; font-family: "DM Sans", sans-serif; font-size: 13px; letter-spacing: 1px; cursor: pointer; transition: all 0.2s; }
      .search-row button:hover { background: var(--accent); color: var(--black); }
      .filters-bar { display: flex; align-items: center; padding: 0 48px; height: 56px; border-bottom: 1px solid var(--light); background: var(--cream); gap: 4px; }
      .filter-label { font-size: 11px; letter-spacing: 2px; color: var(--gray); text-transform: uppercase; margin-right: 16px; }
      .filter-btn { padding: 7px 20px; border: none; background: none; font-family: "DM Sans", sans-serif; font-size: 13px; color: var(--gray); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
      .filter-btn:hover { color: var(--black); }
      .filter-btn.active { color: var(--black); border-bottom-color: var(--accent); }
      .filter-divider { flex: 1; }
      #itemCount { font-size: 12px; color: var(--gray); letter-spacing: 1px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; padding: 48px; min-height: 400px; }
      .card { background: var(--white); border: 1px solid var(--light); border-radius: 4px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
      .card:hover { transform: translateY(-6px); box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
      .card img { width: 100%; aspect-ratio: 3/4; object-fit: contain; padding: 20px; display: block; background: #fff; }
      .card-body { padding: 14px 16px 18px; }
      .card-cat { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--gray); margin-bottom: 5px; }
      .card-name { font-family: "Playfair Display", serif; font-size: 15px; font-weight: 400; color: var(--black); margin-bottom: 12px; line-height: 1.3; height: 40px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .card-footer { display: flex; align-items: center; justify-content: space-between; }
      .card-price { font-size: 16px; font-weight: 500; }
      .btn { padding: 8px 16px; background: var(--black); color: var(--white); border: none; border-radius: 2px; font-family: "DM Sans", sans-serif; font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: background 0.2s; }
      .btn:hover { background: var(--accent); color: var(--black); }
      .overlay { display: none; position: fixed; inset: 0; background: rgba(13,13,13,0.4); z-index: 90; }
      .overlay.open { display: block; }
      .cart-panel { position: fixed; top: 0; right: 0; width: 380px; height: 100%; background: var(--white); z-index: 100; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.4,0,0.2,1); box-shadow: -8px 0 32px rgba(0,0,0,0.1); }
      .cart-panel.open { transform: translateX(0); }
      .cart-header { display: flex; align-items: center; justify-content: space-between; padding: 24px 28px; border-bottom: 1px solid var(--light); }
      .cart-header h2 { font-family: "Playfair Display", serif; font-size: 22px; font-weight: 400; }
      .close-btn { background: none; border: none; font-size: 20px; color: var(--gray); cursor: pointer; padding: 4px; transition: color 0.2s; }
      .close-btn:hover { color: var(--black); }
      #cartItems { flex: 1; overflow-y: auto; padding: 8px 28px; }
      .cart-item { display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--light); align-items: center; }
      .cart-item img { width: 64px; height: 80px; object-fit: contain; background: white; border: 1px solid var(--light); }
      .item-info { flex: 1; min-width: 0; }
      .item-name { font-size: 14px; font-weight: 500; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .item-price { font-size: 13px; font-weight: 500; }
      .rm-btn { background: none; border: none; color: var(--gray); font-size: 18px; cursor: pointer; padding: 4px; transition: color 0.2s; }
      .rm-btn:hover { color: #c0392b; }
      .cart-footer { padding: 20px 28px; border-top: 1px solid var(--light); }
      .subtotal-note { font-size: 12px; color: var(--gray); margin-bottom: 16px; line-height: 1.5; }
      .total-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
      .total-label { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--gray); }
      #total { font-family: "Playfair Display", serif; font-size: 26px; font-weight: 400; }
      .checkout-btn { width: 100%; padding: 15px; background: var(--black); color: var(--white); border: none; font-family: "DM Sans", sans-serif; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; margin-bottom: 10px; transition: background 0.2s; }
      .checkout-btn:hover { background: var(--accent); color: var(--black); }
      .clear-btn { width: 100%; padding: 12px; background: none; border: 1px solid var(--light); font-family: "DM Sans", sans-serif; font-size: 12px; color: var(--gray); letter-spacing: 1px; cursor: pointer; transition: all 0.2s; }
      .clear-btn:hover { border-color: #c0392b; color: #c0392b; }
      .site-footer { background: var(--black); color: var(--gray); padding: 32px 48px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
      .footer-logo { font-family: "Playfair Display", serif; font-size: 18px; letter-spacing: 4px; color: var(--white); text-transform: uppercase; }
    </style>
  </head>
  <body>

    <header>
      <div class="header-left">
        <span class="nav-link">Collections</span>
        <span class="nav-link">Editorial</span>
      </div>
      <div class="logo">MA<em>I</em>SON</div>
      <div class="header-right">
        <button class="cart-btn" id="cartBtn">Bag &nbsp;<div id="badge">0</div></button>
      </div>
    </header>

    <div class="hero">
      <div class="hero-inner">
        <div class="hero-text">
          <h1>New <em>Season</em><br />Arrivals</h1>
          <p>Curated Collection — 2026</p>
        </div>
        <div class="hero-search">
          <span class="search-label">Search the collection</span>
          <div class="search-row">
            <input id="searchInput" type="text" placeholder="Jacket, dress, shirt…" />
            <button id="searchBtn">Search</button>
          </div>
        </div>
      </div>
    </div>

    <div class="filters-bar">
      <span class="filter-label">Category</span>
      <button class="filter-btn active" id="allBtn">All</button>
      <button class="filter-btn" id="menBtn">Men</button>
      <button class="filter-btn" id="womenBtn">Women</button>
      <div class="filter-divider"></div>
      <span id="itemCount">0 items</span>
    </div>

    <div class="grid" id="grid"></div>
    <div class="overlay" id="overlay"></div>

    <div class="cart-panel" id="cartPanel">
      <div class="cart-header">
        <h2>Your Bag</h2>
        <button class="close-btn" id="closeBtn">✕</button>
      </div>
      <div id="cartItems"></div>
      <div class="cart-footer">
        <p class="subtotal-note">Shipping &amp; duties calculated at checkout</p>
        <div class="total-row">
          <span class="total-label">Total</span>
          <span id="total">$0</span>
        </div>
        <button class="checkout-btn" id="checkoutBtn">Proceed to Checkout</button>
        <button class="clear-btn" id="clearBtn">Remove all items</button>
      </div>
    </div>

    <footer class="site-footer">
      <p>© 2026 Maison. All rights reserved.</p>
      <div class="footer-logo">Maison</div>
      <p>Free shipping on orders over $150</p>
    </footer>

    <script>
    
      var clothes  = [];
      var cart     = [];

      var box          = document.getElementById("grid");
      var badge        = document.getElementById("badge");
      var cartItemsBox = document.getElementById("cartItems");
      var totalBox     = document.getElementById("total");
      var itemCount    = document.getElementById("itemCount");
      var cartPanel    = document.getElementById("cartPanel");
      var overlay      = document.getElementById("overlay");
      var cartBtn      = document.getElementById("cartBtn");
      var closeBtn     = document.getElementById("closeBtn");
      var clearBtn     = document.getElementById("clearBtn");
      var checkoutBtn  = document.getElementById("checkoutBtn");
      var searchInput  = document.getElementById("searchInput");
      var searchBtn    = document.getElementById("searchBtn");
      var allBtn       = document.getElementById("allBtn");
      var menBtn       = document.getElementById("menBtn");
      var womenBtn     = document.getElementById("womenBtn");

      async function getProducts() {
        var response = await fetch("https://fakestoreapi.com/products");
        var data     = await response.json();

        clothes = data.filter(function(item) {
          return item.category === "men's clothing" || item.category === "women's clothing";
        });

        renderClothes(clothes);
      }

   
      function renderClothes(list) {
        box.innerHTML = "";
        itemCount.innerHTML = list.length + " items";

        if (list.length === 0) {
          var empty = document.createElement("div");
          empty.className = "empty";
          empty.innerHTML = "<h3>Nothing found</h3>";
          box.appendChild(empty);
          return;
        }

        for (var i = 0; i < list.length; i++) {
          var card = document.createElement("div");
          card.className = "card";
          card.innerHTML =
            "<img src='" + list[i].image + "' />" +
            "<div class='card-body'>" +
              "<p class='card-cat'>" + list[i].category + "</p>" +
              "<p class='card-name'>" + list[i].title + "</p>" +
              "<div class='card-footer'>" +
                "<span class='card-price'>$" + list[i].price + "</span>" +
                "<button class='btn' data-id='" + list[i].id + "'>+ Add</button>" +
              "</div>" +
            "</div>";
          box.appendChild(card);
        }

        var addBtns = box.querySelectorAll(".btn");
        for (var j = 0; j < addBtns.length; j++) {
          addBtns[j].addEventListener("click", function(e) {
            e.stopPropagation();
            addToCart(Number(this.dataset.id));
          });
        }
      }

    
      function addToCart(id) {
        var already = false;
        for (var i = 0; i < cart.length; i++) {
          if (cart[i].id === id) {
            already = true;
          }
        }

        if (already) {
        
        } else {
          for (var i = 0; i < clothes.length; i++) {
            if (clothes[i].id === id) {
              cart.push(clothes[i]);
            }
          }
        }

        renderCart();
        openCart();
      }

    
      function removeFromCart(id) {
        cart = cart.filter(function(item) {
          return item.id !== id;
        });
        renderCart();
      }

     
      function renderCart() {
        badge.innerHTML = cart.length;

        if (cart.length === 0) {
          cartItemsBox.innerHTML =
            "<div style='text-align:center;padding:60px 20px;color:var(--gray)'>" +
              "<div style='font-size:36px;margin-bottom:12px'>🛍</div>" +
              "<p style=\"font-family:'Playfair Display',serif;font-size:18px\">Your bag is empty</p>" +
            "</div>";
          totalBox.innerHTML = "$0";
          return;
        }

        cartItemsBox.innerHTML = "";
        var total = 0;

        for (var i = 0; i < cart.length; i++) {
          total = total + cart[i].price;
          var row = document.createElement("div");
          row.className = "cart-item";
          row.innerHTML =
            "<img src='" + cart[i].image + "' />" +
            "<div class='item-info'>" +
              "<p class='item-name'>" + cart[i].title + "</p>" +
              "<p class='item-price'>$" + cart[i].price + "</p>" +
            "</div>" +
            "<button class='rm-btn' data-id='" + cart[i].id + "'>✕</button>";
          cartItemsBox.appendChild(row);
        }

        totalBox.innerHTML = "$" + total.toFixed(2);

        var rmBtns = cartItemsBox.querySelectorAll(".rm-btn");
        for (var j = 0; j < rmBtns.length; j++) {
          rmBtns[j].addEventListener("click", function() {
            removeFromCart(Number(this.dataset.id));
          });
        }
      }

      function openCart() {
        cartPanel.classList.add("open");
        overlay.classList.add("open");
      }

      function closeCart() {
        cartPanel.classList.remove("open");
        overlay.classList.remove("open");
      }

      allBtn.addEventListener("click", function() {
        allBtn.classList.add("active");
        menBtn.classList.remove("active");
        womenBtn.classList.remove("active");
        renderClothes(clothes);
      });

      menBtn.addEventListener("click", function() {
        menBtn.classList.add("active");
        allBtn.classList.remove("active");
        womenBtn.classList.remove("active");
        var filtered = clothes.filter(function(item) {
          return item.category === "men's clothing";
        });
        renderClothes(filtered);
      });

      womenBtn.addEventListener("click", function() {
        womenBtn.classList.add("active");
        allBtn.classList.remove("active");
        menBtn.classList.remove("active");
        var filtered = clothes.filter(function(item) {
          return item.category === "women's clothing";
        });
        renderClothes(filtered);
      });

      searchBtn.addEventListener("click", function() {
        var query = searchInput.value.toLowerCase();
        var filtered = clothes.filter(function(item) {
          return item.title.toLowerCase().includes(query);
        });
        renderClothes(filtered);
      });

      searchInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
          var query = searchInput.value.toLowerCase();
          var filtered = clothes.filter(function(item) {
            return item.title.toLowerCase().includes(query);
          });
          renderClothes(filtered);
        }
      });

    
      cartBtn.addEventListener("click", function() { openCart(); });
      closeBtn.addEventListener("click", function() { closeCart(); });
      overlay.addEventListener("click", function() { closeCart(); });

      clearBtn.addEventListener("click", function() {
        cart = [];
        renderCart();
      });

      checkoutBtn.addEventListener("click", function() {
        if (cart.length === 0) return;
        cartItemsBox.innerHTML =
          "<div style='text-align:center;padding:48px 20px'>" +
            "<div style='font-size:48px;margin-bottom:16px'>✓</div>" +
            "<p style=\"font-family:'Playfair Display',serif;font-size:22px;margin-bottom:8px\">Order Placed!</p>" +
            "<p style='color:var(--gray)'>Thank you for your purchase.</p>" +
          "</div>";
        cart = [];
        badge.innerHTML = "0";
        totalBox.innerHTML = "$0";
        setTimeout(function() { closeCart(); renderCart(); }, 2000);
      });

      
      getProducts();
    </script>
  </body>
</html>
